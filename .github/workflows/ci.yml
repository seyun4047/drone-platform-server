name: Docker Build CI

on:
  push:
    branches: [ "dev", "feat/*" ]
  pull_request:
    branches: [ "dev", "main"]

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Copy sample files
        run: |
          cp src/main/resources/application_sample.yaml application.yaml
          cp compose_sample.yaml compose.yaml

      - name: Create .env from repository secrets
        run: |
          echo "APP_PORT=${{ secrets.APP_PORT }}" >> .env
          echo "DOCKER_IMAGE_NAME=${{ secrets.DOCKER_IMAGE_NAME }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
          echo "S3_SERVER_ROLE=${{ secrets.S3_SERVER_ROLE }}" >> .env
          echo "S3_SERVER_REGION=${{ secrets.S3_SERVER_REGION }}" >> .env
          echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env
          echo "MYSQL_PORT=${{ secrets.MYSQL_PORT }}" >> .env
          echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
      

      - name: Build Docker images
        run: docker compose -f compose.yaml build

      - name: Run Docker containers
        run: docker compose -f compose.yaml up -d

      - name: List running containers
        run: docker ps

      - name: Stop and remove containers
        if: always()
        run: docker compose -f compose.yaml down