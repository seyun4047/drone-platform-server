services:
  mysql:
    image: mysql:8.0
    container_name: drone-platform-mysql
    restart: always
    ports:
      - "${MYSQL_PORT}:3306"
    env_file: .env
    environment:
      # env_file에 선언된 변수명을 MySQL 이미지 규격에 맞게 매핑
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - drone_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine # 경량화 버전 권장
    container_name: drone-platform-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    # redis-server 커맨드 사용 시 환경변수 직접 주입
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile # 프로젝트 루트의 Dockerfile 참조
    image: drone-platform-app
    container_name: drone-platform-app
    restart: always
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod

volumes:
  drone_mysql_data: