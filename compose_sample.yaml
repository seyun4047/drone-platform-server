version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: drone-platform-mysql
    restart: always
    ports:
      - "${MYSQL_PORT}:3306"
    env_file:
      - .env
    volumes:
      - drone_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: drone-platform-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${DOCKER_IMAGE_NAME}
    container_name: drone-platform-app
    restart: always
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod

volumes:
  drone_mysql_data: